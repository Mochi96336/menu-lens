<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430"><rect width="900" height="430" fill="#f7f3eb"/><text x="36" y="42" font-family="sans-serif" font-size="24" font-weight="700" fill="#27231e">09 → 09A · 390px interaction contract</text><text x="36" y="70" font-family="sans-serif" font-size="14" fill="#665f56">The visible minimap window is 6.6% of the same long ribbon; only its operability changes.</text><text x="36" y="112" font-family="sans-serif" font-size="18" font-weight="700" fill="#27231e">09 parent · indicator follows scrolling</text><g transform="translate(36 132)"><rect width="828" height="68" fill="#fffdf8" stroke="#7b7368"/><rect width="221" height="68" fill="#efe8dc"/><rect x="221" width="166" height="68" fill="#f7f1e7"/><rect x="387" width="166" height="68" fill="#efe8dc"/><rect x="553" width="110" height="68" fill="#f7f1e7"/><rect x="663" width="110" height="68" fill="#efe8dc"/><rect x="773" width="55" height="68" fill="#f7f1e7"/><rect x="0" y="51" width="55" height="17" fill="#b34a2e"/></g><text x="36" y="236" font-family="sans-serif" font-size="14" fill="#665f56">The user can tap a category start, but exact distant Product positions still require ribbon travel.</text><text x="36" y="286" font-family="sans-serif" font-size="18" font-weight="700" fill="#27231e">09A child · window is a horizontal slider and drag target</text><g transform="translate(36 306)"><rect width="828" height="68" fill="#fffdf8" stroke="#7b7368"/><rect width="221" height="68" fill="#efe8dc"/><rect x="221" width="166" height="68" fill="#f7f1e7"/><rect x="387" width="166" height="68" fill="#efe8dc"/><rect x="553" width="110" height="68" fill="#f7f1e7"/><rect x="663" width="110" height="68" fill="#efe8dc"/><rect x="773" width="55" height="68" fill="#f7f1e7"/><rect x="387" y="49" width="55" height="19" fill="#b34a2e"/><path d="M414 44 v-18" stroke="#b34a2e" stroke-width="3"/><path d="M407 32 l7-7 7 7" fill="none" stroke="#b34a2e" stroke-width="3"/><text x="334" y="26" font-family="sans-serif" font-size="14" font-weight="700" fill="#27231e">50% → Product 16</text></g><text x="36" y="412" font-family="sans-serif" font-size="13" fill="#665f56">ArrowLeft / ArrowRight move one Product; Home / End reach the first or final Product.</text></svg>