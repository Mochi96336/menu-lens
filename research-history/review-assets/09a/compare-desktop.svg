<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470"><rect width="1000" height="470" fill="#f7f3eb"/><text x="40" y="44" font-family="sans-serif" font-size="25" font-weight="700" fill="#27231e">09 → 09A · desktop phone-frame interaction contract</text><text x="40" y="74" font-family="sans-serif" font-size="14" fill="#665f56">Phone-frame width changes the viewport-window percentage, not the 30-Product ribbon or canonical mapping.</text><text x="40" y="120" font-family="sans-serif" font-size="18" font-weight="700" fill="#27231e">Parent 09</text><g transform="translate(40 140)"><rect width="920" height="82" fill="#fffdf8" stroke="#7b7368"/><rect width="245" height="82" fill="#efe8dc"/><rect x="245" width="184" height="82" fill="#f7f1e7"/><rect x="429" width="184" height="82" fill="#efe8dc"/><rect x="613" width="123" height="82" fill="#f7f1e7"/><rect x="736" width="123" height="82" fill="#efe8dc"/><rect x="859" width="61" height="82" fill="#f7f1e7"/><rect x="0" y="63" width="67" height="19" fill="#b34a2e"/><text x="18" y="35" font-family="sans-serif" font-size="14" fill="#27231e">read-only viewport window</text></g><text x="40" y="265" font-family="sans-serif" font-size="14" fill="#665f56">Category buttons still jump to category starts; the indicator itself cannot move the ribbon.</text><text x="40" y="316" font-family="sans-serif" font-size="18" font-weight="700" fill="#27231e">Child 09A</text><g transform="translate(40 336)"><rect width="920" height="82" fill="#fffdf8" stroke="#7b7368"/><rect width="245" height="82" fill="#efe8dc"/><rect x="245" width="184" height="82" fill="#f7f1e7"/><rect x="429" width="184" height="82" fill="#efe8dc"/><rect x="613" width="123" height="82" fill="#f7f1e7"/><rect x="736" width="123" height="82" fill="#efe8dc"/><rect x="859" width="61" height="82" fill="#f7f1e7"/><rect x="782" y="61" width="67" height="21" fill="#b34a2e"/><path d="M815 56 v-22" stroke="#b34a2e" stroke-width="3"/><path d="M808 41 l7-7 7 7" fill="none" stroke="#b34a2e" stroke-width="3"/><text x="690" y="35" font-family="sans-serif" font-size="14" font-weight="700" fill="#27231e">85% → Product 26</text></g><text x="40" y="452" font-family="sans-serif" font-size="13" fill="#665f56">No new map, mode, camera, Product width, category order, detail state, or order action.</text></svg>