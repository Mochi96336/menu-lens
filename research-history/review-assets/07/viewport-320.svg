<svg xmlns="http://www.w3.org/2000/svg" width="760" height="920" viewBox="0 0 760 920" role="img" aria-labelledby="title desc"><title id="title">07 Horizontal Menu Atlas at 320 pixels</title><desc id="desc">A 320 pixel phone-width baseline with horizontal category tabs and one vertical product document.</desc><rect width="760" height="920" fill="#f3efe8"/><text x="44" y="52" font-family="sans-serif" font-size="24" font-weight="700" fill="#28231f">07 · 320px viewport contract</text><text x="44" y="82" font-family="sans-serif" font-size="15" fill="#6b625a">horizontal category tabs · one vertical document · inline detail</text><g transform="translate(220 110)"><rect x="0" y="0" width="320" height="760" rx="28" fill="#fffdf9" stroke="#28231f" stroke-width="3"/><text x="20" y="34" font-family="sans-serif" font-size="12" fill="#28231f">9:41</text><text x="245" y="34" font-family="sans-serif" font-size="12" fill="#28231f">●●● 100%</text><text x="20" y="76" font-family="serif" font-size="25" font-weight="700" fill="#28231f">潮巷小館</text><text x="20" y="100" font-family="sans-serif" font-size="11" fill="#6b625a">30 道料理 · 6 個分類 · NT$120–NT$560</text><line x1="0" y1="118" x2="320" y2="118" stroke="#504940"/><g transform="translate(12 130)"><rect x="0" y="0" width="76" height="34" rx="17" fill="#28231f"/><text x="13" y="21" font-family="sans-serif" font-size="11" font-weight="700" fill="#fffdf9">個人主餐</text><rect x="84" y="0" width="66" height="34" rx="17" fill="none" stroke="#504940"/><text x="99" y="21" font-family="sans-serif" font-size="11" fill="#6b625a">飯麵類</text><rect x="158" y="0" width="76" height="34" rx="17" fill="none" stroke="#504940"/><text x="173" y="21" font-family="sans-serif" font-size="11" fill="#6b625a">分享料理</text><rect x="242" y="0" width="62" height="34" rx="17" fill="none" stroke="#504940"/><text x="259" y="21" font-family="sans-serif" font-size="11" fill="#6b625a">小食</text></g><line x1="0" y1="178" x2="320" y2="178" stroke="#504940"/><g transform="translate(16 194)"><text x="0" y="14" font-family="monospace" font-size="10" fill="#b3543d">01</text><text x="0" y="42" font-family="serif" font-size="20" font-weight="700" fill="#28231f">個人主餐</text><text x="0" y="62" font-family="sans-serif" font-size="11" fill="#6b625a">附主食或可單人完成的一份主菜。</text><text x="255" y="42" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="700" fill="#28231f">8 道</text><text x="288" y="62" text-anchor="end" font-family="sans-serif" font-size="10" fill="#6b625a">NT$280–390</text></g><line x1="0" y1="275" x2="320" y2="275" stroke="#d6cec4"/><g font-family="sans-serif" fill="#28231f"><text x="16" y="309" font-size="14" font-weight="700">炙烤味噌雞腿定食</text><text x="304" y="309" text-anchor="end" font-size="12" font-weight="700">NT$320</text><text x="16" y="330" font-size="10" fill="#6b625a">醬香、炙烤</text><line x1="0" y1="348" x2="320" y2="348" stroke="#d6cec4"/><text x="16" y="382" font-size="14" font-weight="700">檸香鹽麴鮭魚定食</text><text x="304" y="382" text-anchor="end" font-size="12" font-weight="700">NT$360</text><text x="16" y="403" font-size="10" fill="#6b625a">清爽、鹽麴</text><line x1="0" y1="421" x2="320" y2="421" stroke="#d6cec4"/><text x="16" y="455" font-size="14" font-weight="700">黑蒜胡椒牛小排</text><text x="304" y="455" text-anchor="end" font-size="12" font-weight="700">NT$390</text><text x="16" y="476" font-size="10" fill="#6b625a">濃郁、胡椒</text><line x1="0" y1="494" x2="320" y2="494" stroke="#d6cec4"/><text x="16" y="528" font-size="14" font-weight="700">塔香三杯杏鮑菇定食</text><text x="304" y="528" text-anchor="end" font-size="12" font-weight="700">NT$290</text><text x="16" y="549" font-size="10" fill="#6b625a">蔬食、三杯</text><line x1="0" y1="567" x2="320" y2="567" stroke="#d6cec4"/><text x="16" y="601" font-size="14" font-weight="700">川味麻婆豆腐鍋</text><text x="304" y="601" text-anchor="end" font-size="12" font-weight="700">NT$280</text><text x="16" y="622" font-size="10" fill="#9f3f31">麻辣、慢煨 · 售完</text></g><rect x="0" y="712" width="320" height="48" fill="#f8f4ee"/><line x1="0" y1="712" x2="320" y2="712" stroke="#d6cec4"/><text x="160" y="741" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b625a">六個分類都保留在同一份垂直文件中</text></g></svg>