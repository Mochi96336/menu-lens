<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="900" viewBox="0 0 1120 900" role="img" aria-labelledby="title desc"><title id="title">07 Horizontal Menu Atlas in the desktop phone frame</title><desc id="desc">The baseline remains a phone-sized horizontal category tab row over one vertical document when reviewed on desktop.</desc><rect width="1120" height="900" fill="#eee8df"/><text x="52" y="58" font-family="sans-serif" font-size="26" font-weight="700" fill="#28231f">07 · desktop review frame</text><text x="52" y="90" font-family="sans-serif" font-size="15" fill="#6b625a">desktop changes the surrounding canvas, not the mobile navigation model</text><rect x="52" y="126" width="430" height="700" rx="12" fill="#f8f4ee" stroke="#c8beb2"/><text x="78" y="170" font-family="sans-serif" font-size="13" font-weight="700" fill="#b3543d">BASELINE CONTRACT</text><text x="78" y="208" font-family="serif" font-size="27" font-weight="700" fill="#28231f">Horizontal Menu Atlas</text><text x="78" y="246" font-family="sans-serif" font-size="15" fill="#4f4942">橫向只做分類定位。</text><text x="78" y="272" font-family="sans-serif" font-size="15" fill="#4f4942">垂直保留完整 30 道料理。</text><text x="78" y="320" font-family="sans-serif" font-size="13" fill="#6b625a">✓ one document</text><text x="78" y="348" font-family="sans-serif" font-size="13" fill="#6b625a">✓ inline Product detail</text><text x="78" y="376" font-family="sans-serif" font-size="13" fill="#6b625a">✓ no filter or route change</text><text x="78" y="404" font-family="sans-serif" font-size="13" fill="#6b625a">✓ familiar phone scrolling</text><text x="78" y="468" font-family="sans-serif" font-size="13" font-weight="700" fill="#28231f">Remaining baseline cost</text><text x="78" y="500" font-family="sans-serif" font-size="13" fill="#6b625a">跨分類比較仍依賴上下往返與記憶。</text><g transform="translate(625 85)"><rect x="0" y="0" width="390" height="760" rx="30" fill="#fffdf9" stroke="#28231f" stroke-width="3"/><text x="20" y="34" font-family="sans-serif" font-size="12" fill="#28231f">9:41</text><text x="315" y="34" font-family="sans-serif" font-size="12" fill="#28231f">●●● 100%</text><text x="20" y="76" font-family="serif" font-size="25" font-weight="700" fill="#28231f">潮巷小館</text><text x="20" y="100" font-family="sans-serif" font-size="11" fill="#6b625a">30 道料理 · 6 個分類 · NT$120–NT$560</text><line x1="0" y1="118" x2="390" y2="118" stroke="#504940"/><g transform="translate(12 130)"><rect x="0" y="0" width="78" height="34" rx="17" fill="#28231f"/><text x="14" y="21" font-family="sans-serif" font-size="11" font-weight="700" fill="#fffdf9">個人主餐</text><rect x="86" y="0" width="67" height="34" rx="17" fill="none" stroke="#504940"/><text x="101" y="21" font-family="sans-serif" font-size="11" fill="#6b625a">飯麵類</text><rect x="161" y="0" width="78" height="34" rx="17" fill="none" stroke="#504940"/><text x="176" y="21" font-family="sans-serif" font-size="11" fill="#6b625a">分享料理</text><rect x="247" y="0" width="60" height="34" rx="17" fill="none" stroke="#504940"/><text x="263" y="21" font-family="sans-serif" font-size="11" fill="#6b625a">小食</text><rect x="315" y="0" width="60" height="34" rx="17" fill="none" stroke="#504940"/><text x="331" y="21" font-family="sans-serif" font-size="11" fill="#6b625a">飲料</text></g><line x1="0" y1="178" x2="390" y2="178" stroke="#504940"/><text x="18" y="214" font-family="monospace" font-size="10" fill="#b3543d">01</text><text x="18" y="244" font-family="serif" font-size="20" font-weight="700" fill="#28231f">個人主餐</text><text x="18" y="264" font-family="sans-serif" font-size="11" fill="#6b625a">附主食或可單人完成的一份主菜。</text><text x="372" y="244" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="700" fill="#28231f">8 道</text><line x1="0" y1="282" x2="390" y2="282" stroke="#d6cec4"/><g font-family="sans-serif" fill="#28231f"><text x="18" y="318" font-size="14" font-weight="700">炙烤味噌雞腿定食</text><text x="372" y="318" text-anchor="end" font-size="12" font-weight="700">NT$320</text><text x="18" y="339" font-size="10" fill="#6b625a">醬香、炙烤</text><line x1="0" y1="358" x2="390" y2="358" stroke="#d6cec4"/><text x="18" y="394" font-size="14" font-weight="700">檸香鹽麴鮭魚定食</text><text x="372" y="394" text-anchor="end" font-size="12" font-weight="700">NT$360</text><text x="18" y="415" font-size="10" fill="#6b625a">清爽、鹽麴</text><line x1="0" y1="434" x2="390" y2="434" stroke="#d6cec4"/><text x="18" y="470" font-size="14" font-weight="700">黑蒜胡椒牛小排</text><text x="372" y="470" text-anchor="end" font-size="12" font-weight="700">NT$390</text><text x="18" y="491" font-size="10" fill="#6b625a">濃郁、胡椒</text><line x1="0" y1="510" x2="390" y2="510" stroke="#d6cec4"/><text x="18" y="546" font-size="14" font-weight="700">塔香三杯杏鮑菇定食</text><text x="372" y="546" text-anchor="end" font-size="12" font-weight="700">NT$290</text><text x="18" y="567" font-size="10" fill="#6b625a">蔬食、三杯</text></g><rect x="0" y="712" width="390" height="48" fill="#f8f4ee"/><line x1="0" y1="712" x2="390" y2="712" stroke="#d6cec4"/><text x="195" y="741" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b625a">六個分類都保留在同一份垂直文件中</text></g></svg>