<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1080" viewBox="0 0 1280 1080" role="img" aria-labelledby="title desc">
  <title id="title">22G collapse-only controlled comparison</title>
  <desc id="desc">Parent 18 and child 22G at 320 pixel, 390 pixel, and desktop viewports. Width, camera, typography, and padding remain identical; only the paired category collapses to a 2.2rem header.</desc>
  <defs>
    <style>
      .bg{fill:#e9e3d8}.card{fill:#f8f5ef;stroke:#8f867a}.sheet{fill:#eee8dd;stroke:#3d3832;stroke-width:2}.cat{fill:#faf7f1;stroke:#aaa195}.pair{fill:#f1ece3;stroke:#aaa195}.focus{fill:none;stroke:#a54a2a;stroke-width:3}.line{stroke:#c8c0b5}.ink{fill:#211e1a}.muted{fill:#6a6259}.accent{fill:#8f3e25}.t{font-family:Arial,"Noto Sans CJK TC",sans-serif}.s{font-family:Georgia,"Noto Serif CJK TC",serif}.title{font-size:28px}.label{font-size:16px;font-weight:700}.meta{font-size:11px}.note{font-size:12px;font-weight:700}
    </style>
    <g id="base">
      <rect class="sheet" width="430" height="220"/>
      <rect class="cat" x="1" y="1" width="141" height="125"/><rect class="pair" x="1" y="126" width="141" height="93"/>
      <rect class="cat" x="144" y="1" width="141" height="132"/><rect class="pair" x="144" y="133" width="141" height="86"/>
      <rect class="cat" x="287" y="1" width="142" height="146"/><rect class="pair" x="287" y="147" width="142" height="72"/>
      <path class="line" d="M10 28H133M10 48H133M10 68H133M10 88H133M10 108H133M10 146H133M10 166H133M10 186H133M10 206H133"/>
    </g>
    <g id="collapsed">
      <rect class="sheet" width="430" height="220"/>
      <rect class="cat" x="1" y="1" width="141" height="184"/><rect class="pair" x="1" y="186" width="141" height="33"/>
      <rect class="cat" x="144" y="1" width="141" height="132"/><rect class="pair" x="144" y="133" width="141" height="86"/>
      <rect class="cat" x="287" y="1" width="142" height="146"/><rect class="pair" x="287" y="147" width="142" height="72"/>
      <path class="line" d="M10 28H133M10 50H133M10 72H133M10 94H133M10 116H133M10 138H133M10 160H133"/>
      <rect class="focus" x="2" y="2" width="139" height="181"/>
    </g>
  </defs>
  <rect class="bg" width="1280" height="1080"/>
  <text class="s title ink" x="24" y="40">Menu Lens — 22G Collapse-only Focus</text>
  <text class="t meta muted" x="24" y="64">Same 46rem sheet, equal columns, camera, fonts, padding, and line-height. Only the paired Product list becomes a 2.2rem clickable header.</text>

  <g transform="translate(28 100)">
    <g><rect class="card" width="590" height="285" rx="14"/><text class="t label ink" x="16" y="28">18 parent · 320px window</text><g transform="translate(78 48)"><use href="#base"/></g><text class="t note accent" x="16" y="265">Both paired categories remain fully visible</text></g>
    <g transform="translate(620)"><rect class="card" width="590" height="285" rx="14"/><text class="t label ink" x="16" y="28">22G focused · 320px window</text><g transform="translate(78 48)"><use href="#collapsed"/></g><text class="t note accent" x="16" y="265">Paired Product list → 2.2rem header</text></g>
  </g>

  <g transform="translate(28 415)">
    <g><rect class="card" width="590" height="285" rx="14"/><text class="t label ink" x="16" y="28">18 parent · 390px window</text><g transform="translate(78 48)"><use href="#base"/></g><text class="t note accent" x="16" y="265">Overview and comparison remain simultaneous</text></g>
    <g transform="translate(620)"><rect class="card" width="590" height="285" rx="14"/><text class="t label ink" x="16" y="28">22G focused · 390px window</text><g transform="translate(78 48)"><use href="#collapsed"/></g><text class="t note accent" x="16" y="265">More vertical area, less simultaneous comparison</text></g>
  </g>

  <g transform="translate(28 730)">
    <g><rect class="card" width="590" height="285" rx="14"/><text class="t label ink" x="16" y="28">18 parent · desktop phone frame</text><g transform="translate(78 48)"><use href="#base"/></g><text class="t note accent" x="16" y="265">Product .64/.58rem · padding .5rem</text></g>
    <g transform="translate(620)"><rect class="card" width="590" height="285" rx="14"/><text class="t label ink" x="16" y="28">22G focused · desktop phone frame</text><g transform="translate(78 48)"><use href="#collapsed"/></g><text class="t note accent" x="16" y="265">Same type and width; collapse is the only change</text></g>
  </g>
</svg>
