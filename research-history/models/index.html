<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eeeae2" />
    <meta name="description" content="Menu Lens 設計模型工作台：並排操作同組研究物件，集中檢視變因、關聯與原始記錄。" />
    <title>Menu Lens — Design Model</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../history.css" />
    <link rel="stylesheet" href="../model-page.css" />
    <link rel="stylesheet" href="../model-page-workbench.css" />
    <link rel="stylesheet" href="../model-route-diagram.css" />
    <script src="../prototype-registry.js"></script>
  </head>
  <body class="model-page">
    <a class="skip-link" href="#main">跳到主要內容</a>

    <header class="model-masthead">
      <nav class="model-nav site-shell" aria-label="設計模型導覽">
        <a class="model-wordmark" href="../">Menu Lens</a>
        <label class="model-switcher">
          <span>設計模型</span>
          <select id="model-select" aria-label="切換設計模型"></select>
        </label>
        <div class="model-nav__links">
          <a href="#workbench">研究物件</a>
          <a href="#inspector">物件資訊</a>
          <a href="../#catalog">完整目錄</a>
        </div>
      </nav>

      <div class="model-hero site-shell">
        <div class="model-hero__intro">
          <p id="model-eyebrow" class="eyebrow">Design model</p>
          <h1 id="model-title">載入設計模型</h1>
          <p id="model-summary" class="lede"></p>
          <p id="model-stats" class="model-stats" aria-live="polite"></p>
        </div>

        <details class="model-definition-disclosure">
          <summary>
            <strong>模型定義</strong>
            <span class="model-definition-disclosure__hint">展開</span>
          </summary>
          <dl class="model-definition" aria-label="設計模型定義">
            <div><dt>共同母體</dt><dd id="model-substrate"></dd></div>
            <div><dt>保持不變</dt><dd id="model-retains"></dd></div>
            <div><dt>主要變因</dt><dd id="model-varies"></dd></div>
            <div><dt>研究問題</dt><dd id="model-question"></dd></div>
          </dl>
        </details>
      </div>
    </header>

    <main id="main">
      <section id="workbench" class="model-workbench model-workbench-shell" aria-label="研究物件工作台">
        <div class="model-route-layout">
          <div class="model-section-strip">
            <p class="model-section-strip__eyebrow eyebrow">Research route</p>
            <div id="section-tabs" class="model-section-tabs" role="tablist" aria-label="切換研究方向"></div>
          </div>

          <details id="model-concept" class="model-concept" hidden>
            <summary id="model-concept-summary" class="model-concept__summary">
              <span class="model-concept__summary-label">概念預覽</span>
              <strong id="model-diagram-signature"></strong>
              <span class="model-concept__summary-hint" aria-hidden="true">展開</span>
            </summary>
            <div class="model-concept__body">
              <p id="model-diagram-statement" class="model-concept__statement"></p>
              <div id="model-concept-vignette" class="model-concept-vignette" aria-hidden="true"></div>
              <div class="model-concept__section-copy" aria-live="polite">
                <p class="model-route__current"><strong id="section-current-label"></strong><span id="section-route-note"></span></p>
                <p id="section-summary" class="model-section-summary model-concept__section-summary"></p>
              </div>
            </div>
          </details>
        </div>

        <div id="model-section-panel" class="model-section-panel" role="tabpanel">
          <header class="model-object-bar">
            <div class="model-object-bar__heading">
              <p class="eyebrow">Research objects</p>
              <h2 id="model-object-title">研究物件</h2>
            </div>

            <div class="model-object-bar__actions" aria-label="研究物件操作">
              <button id="show-all" type="button" hidden>返回整組</button>
              <button id="compare-parent" class="model-compare-action" type="button" hidden>與 parent 比較</button>
              <label class="model-viewport-picker">
                <span>預覽</span>
                <select id="viewport-select" aria-label="預覽尺寸">
                  <option value="320">320px</option>
                  <option value="390">390px</option>
                  <option value="desktop">1024px</option>
                </select>
              </label>
            </div>
          </header>

          <select id="object-select" hidden aria-hidden="true" tabindex="-1"></select>
          <p id="viewport-note" hidden aria-live="polite"></p>

          <div id="all-live-board" class="model-live-board" data-viewport="390" data-view-mode="all" aria-label="本組研究物件操作板"></div>

          <section id="inspector" class="model-object-inspector" aria-labelledby="inspector-object-title">
            <header class="model-object-inspector__header">
              <div>
                <p id="inspector-role" class="eyebrow">研究物件</p>
                <h2 id="inspector-object-title"></h2>
              </div>
              <span id="inspector-status" class="status"></span>
            </header>

            <div id="inspector-tabs" class="model-inspector-tabs" role="tablist" aria-label="物件資訊">
              <button id="inspector-tab-summary" type="button" role="tab" data-inspector-tab="summary" aria-selected="true" aria-controls="inspector-panel-summary">摘要</button>
              <button id="inspector-tab-relations" type="button" role="tab" data-inspector-tab="relations" aria-selected="false" aria-controls="inspector-panel-relations">關聯</button>
              <button id="inspector-tab-records" type="button" role="tab" data-inspector-tab="records" aria-selected="false" aria-controls="inspector-panel-records">記錄</button>
            </div>

            <div id="inspector-panel-summary" class="model-inspector-panel" role="tabpanel" aria-labelledby="inspector-tab-summary">
              <section class="model-inspector-block model-inspector-block--difference">
                <p id="difference-eyebrow" class="eyebrow">研究角色</p>
                <h3 id="difference-variable"></h3>
                <dl class="model-difference-list">
                  <div><dt id="difference-before-label">來源脈絡</dt><dd id="difference-before"></dd></div>
                  <div><dt id="difference-after-label">目前物件</dt><dd id="difference-after"></dd></div>
                  <div><dt id="difference-unchanged-label">保留條件</dt><dd id="difference-unchanged"></dd></div>
                </dl>
              </section>

              <section class="model-inspector-block model-inspector-block--outcome">
                <h3 id="outcome-title">研究狀態</h3>
                <dl class="model-outcome-list">
                  <div><dt>狀態</dt><dd id="outcome-disposition"></dd></div>
                  <div><dt>證據</dt><dd id="outcome-evidence"></dd></div>
                  <div id="outcome-next-row"><dt id="outcome-next-label">下一步</dt><dd id="outcome-next-gate"></dd></div>
                </dl>
              </section>
            </div>

            <div id="inspector-panel-relations" class="model-inspector-panel" role="tabpanel" aria-labelledby="inspector-tab-relations" hidden>
              <div id="inspector-relations" class="model-lineage"></div>
            </div>

            <div id="inspector-panel-records" class="model-inspector-panel" role="tabpanel" aria-labelledby="inspector-tab-records" hidden>
              <div id="inspector-records" class="model-record-links"></div>
            </div>
          </section>
        </div>
      </section>
    </main>

    <footer class="model-footer site-shell">
      <p>Menu Lens design model viewer</p>
      <p>Presentation grouping only · canonical catalog remains unchanged</p>
    </footer>

    <script type="module" src="../model-page.mjs"></script>
  </body>
</html>
