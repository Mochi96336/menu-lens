name: Agent model route semantic guard

on:
  push:
    branches:
      - agent/model-route-source-of-truth

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/model-route-source-of-truth
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Add semantic classification guard
        run: |
          python3 <<'PY'
          from pathlib import Path

          contracts = Path("research-history/catalog/model-route-contracts.mjs")
          text = contracts.read_text(encoding="utf-8")
          old = '''export const modelRouteContractById = Object.freeze(Object.fromEntries(
            modelRouteContracts.map((contract) => [contract.id, contract]),
          ));

          export const getModelRouteContract = (modelId) => {
          '''.replace("          ", "")
          new = '''export const modelRouteContractById = Object.freeze(Object.fromEntries(
            modelRouteContracts.map((contract) => [contract.id, contract]),
          ));

          export const modelRouteObjectOwnerById = Object.freeze(Object.fromEntries(objectModelOwners));

          export const getModelRouteContract = (modelId) => {
          '''.replace("          ", "")
          if text.count(old) != 1:
              raise RuntimeError("Could not locate modelRouteContractById export block")
          contracts.write_text(text.replace(old, new, 1), encoding="utf-8")

          validator = Path("scripts/archive/validate-model-route-contracts.mjs")
          text = validator.read_text(encoding="utf-8")
          old = 'import { modelRouteContracts } from "../../research-history/catalog/model-route-contracts.mjs";'
          new = '''import {
            modelRouteContracts,
            modelRouteObjectOwnerById,
          } from "../../research-history/catalog/model-route-contracts.mjs";'''.replace("          ", "")
          if text.count(old) != 1:
              raise RuntimeError("Could not locate route contract import")
          text = text.replace(old, new, 1)

          anchor = '''const canonicalModelIds = modelRouteContracts.map((contract) => contract.id);

          for (const contract of modelRouteContracts) {
          '''.replace("          ", "")
          replacement = '''const canonicalModelIds = modelRouteContracts.map((contract) => contract.id);

          const semanticClassificationDecisions = Object.freeze({
            "14": "multiscale-focus",
            "17": "horizontal-navigation",
            "17A": "horizontal-navigation",
          });

          for (const [objectId, expectedModelId] of Object.entries(semanticClassificationDecisions)) {
            const actualModelId = modelRouteObjectOwnerById[objectId];
            if (actualModelId !== expectedModelId) {
              throw new Error(`${objectId} must remain in ${expectedModelId}; received ${actualModelId ?? "no owner"}.`);
            }
          }

          for (const contract of modelRouteContracts) {
          '''.replace("          ", "")
          if text.count(anchor) != 1:
              raise RuntimeError("Could not locate canonicalModelIds anchor")
          validator.write_text(text.replace(anchor, replacement, 1), encoding="utf-8")

          Path(".github/workflows/agent-model-route-guard.yml").unlink()
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate semantic guard
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Commit semantic guard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(archive): retain route classification decisions"
          git push origin HEAD:agent/model-route-source-of-truth
