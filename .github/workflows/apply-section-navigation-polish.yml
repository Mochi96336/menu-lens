name: Apply section navigation polish

on:
  push:
    branches: [fix/model-section-navigation]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: fix/model-section-navigation
          fetch-depth: 0

      - name: Apply reviewed patch
        run: |
          python scripts/archive/apply-section-navigation-polish.py
          node --check research-history/model-page.mjs
          node --check scripts/archive/validate-section-tabs-browser.mjs
          git diff --check

      - name: Remove temporary applicator
        run: |
          rm .github/workflows/apply-section-navigation-polish.yml
          rm scripts/archive/apply-section-navigation-polish.py

      - name: Commit polished result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish section navigation overflow and history behavior"
          git push origin HEAD:fix/model-section-navigation
