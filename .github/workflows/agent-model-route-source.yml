name: Agent model route source refactor

on:
  push:
    branches:
      - agent/model-route-source-of-truth

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/model-route-source-of-truth
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Apply source-of-truth refactor
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def write(path, content):
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding="utf-8")

          def replace_once(path, old, new):
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one exact match, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          def regex_once(path, pattern, replacement):
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one regex match, found {count}")
              target.write_text(updated, encoding="utf-8")

          write("research-history/catalog/model-route-contracts.mjs", '''import { modelDiagramPresentations } from "./model-diagram-presentations.mjs";
          import { designModels } from "./presentation-models.mjs";

          const canonicalModelIds = designModels.map((model) => model.id);
          const diagramModelIds = Object.keys(modelDiagramPresentations);
          if (JSON.stringify(diagramModelIds) !== JSON.stringify(canonicalModelIds)) {
            throw new Error(`Model route diagrams must cover canonical models in order: ${canonicalModelIds.join(", ")}.`);
          }

          const objectModelOwners = new Map();

          const freezeSectionContract = ({ model, section, diagram }) => Object.freeze({
            id: section.id,
            title: section.title,
            summary: section.summary,
            defaultObjectId: section.defaultObjectId,
            objectIds: section.objectIds,
            modelSection: section,
            diagram,
          });

          const freezeModelContract = (model) => {
            const diagram = modelDiagramPresentations[model.id];
            if (!diagram) throw new Error(`Missing route diagram for ${model.id}.`);

            const canonicalSectionIds = model.sections.map((section) => section.id);
            const diagramSectionIds = Object.keys(diagram.sections);
            if (JSON.stringify(diagramSectionIds) !== JSON.stringify(canonicalSectionIds)) {
              throw new Error(`${model.id} route diagram must preserve canonical section order: ${canonicalSectionIds.join(", ")}.`);
            }

            const sections = Object.freeze(model.sections.map((section) => {
              if (!section.objectIds.includes(section.defaultObjectId)) {
                throw new Error(`${model.id}/${section.id} default object ${section.defaultObjectId} is not in its canonical objectIds.`);
              }

              for (const objectId of section.objectIds) {
                const existingOwner = objectModelOwners.get(objectId);
                if (existingOwner && existingOwner !== model.id) {
                  throw new Error(`${objectId} crosses model families: ${existingOwner}, ${model.id}.`);
                }
                objectModelOwners.set(objectId, model.id);
              }

              const sectionDiagram = diagram.sections[section.id];
              if (!sectionDiagram) throw new Error(`${model.id}/${section.id} is missing route presentation metadata.`);
              if ("objectIds" in sectionDiagram || "defaultObjectId" in sectionDiagram) {
                throw new Error(`${model.id}/${section.id} route metadata must not redefine canonical membership.`);
              }
              return freezeSectionContract({ model, section, diagram: sectionDiagram });
            }));

            return Object.freeze({
              id: model.id,
              title: model.title,
              model,
              diagram,
              sections,
              sectionById: Object.freeze(Object.fromEntries(sections.map((section) => [section.id, section]))),
            });
          };

          export const modelRouteContracts = Object.freeze(designModels.map(freezeModelContract));

          export const modelRouteContractById = Object.freeze(Object.fromEntries(
            modelRouteContracts.map((contract) => [contract.id, contract]),
          ));

          export const getModelRouteContract = (modelId) => {
            const contract = modelRouteContractById[modelId];
            if (!contract) throw new Error(`Unknown model route contract ${modelId}.`);
            return contract;
          };

          export const getModelRouteSectionContract = (modelId, sectionId) => {
            const contract = getModelRouteContract(modelId);
            const section = contract.sectionById[sectionId];
            if (!section) throw new Error(`Unknown model route section ${modelId}/${sectionId}.`);
            return section;
          };
          '''.replace("          ", ""))

          write("scripts/archive/model-route-browser-cases.mjs", '''import {
            getModelRouteContract,
            getModelRouteSectionContract,
          } from "../../research-history/catalog/model-route-contracts.mjs";

          const representativeSpecs = Object.freeze([
            {
              model: "complete-document",
              section: "baseline",
              variant: "01",
              vignetteType: "document",
              vignetteVariant: "baseline",
              mobileSection: "ledger-density",
              desktopMaxWidth: 620,
            },
            {
              model: "horizontal-navigation",
              section: "spread",
              variant: "08",
              vignetteType: "horizontal",
              vignetteVariant: "spread",
              mobileSection: "weighted-strip",
              desktopMaxWidth: 1160,
            },
            {
              model: "paper-field",
              section: "semantic-information",
              variant: "12A",
              vignetteType: "paper-field",
              vignetteVariant: "semantic",
              mobileSection: "elastic-geometry",
              desktopMaxWidth: 720,
            },
            {
              model: "landscape-paper",
              section: "core",
              variant: "18",
              vignetteType: "landscape",
              vignetteVariant: "core",
              mobileSection: "stopped-routes",
              desktopMaxWidth: 1100,
            },
            {
              model: "multiscale-focus",
              section: "model",
              variant: "06",
              vignetteType: "scale",
              vignetteVariant: "focus",
              mobileSection: "folded-topology",
              desktopMaxWidth: 720,
            },
            {
              model: "depth-projection",
              section: "projection-lens",
              variant: "25P",
              vignetteType: "depth",
              vignetteVariant: "projection",
              mobileSection: "parallax-volume",
              desktopMaxWidth: 780,
            },
          ]);

          const enrichRepresentative = (spec) => {
            const contract = getModelRouteContract(spec.model);
            const section = getModelRouteSectionContract(spec.model, spec.section);
            if (!section.objectIds.includes(spec.variant)) {
              throw new Error(`${spec.model}/${spec.section} representative ${spec.variant} is not a canonical section object.`);
            }
            if (!contract.sectionById[spec.mobileSection]) {
              throw new Error(`${spec.model} mobile representative section ${spec.mobileSection} is not canonical.`);
            }
            return Object.freeze({
              ...spec,
              title: contract.title,
              kind: contract.diagram.kind,
              nodeCount: contract.sections.length,
              objectIds: section.objectIds,
            });
          };

          export const modelRouteBrowserCases = Object.freeze(representativeSpecs.map(enrichRepresentative));

          export const routeGeometryCases = Object.freeze(modelRouteBrowserCases.map((testCase) => {
            const contract = getModelRouteContract(testCase.model);
            const layout = contract.diagram.routeLayout.type;
            const routeCount = layout === "parallel-rail"
              ? contract.sections.length
              : contract.diagram.edges.length;
            return Object.freeze({
              model: testCase.model,
              section: testCase.section,
              mobileSection: testCase.mobileSection,
              layout,
              desktopMaxWidth: testCase.desktopMaxWidth,
              ...(layout === "compact-sequence"
                ? { directLines: routeCount }
                : { drops: routeCount }),
            });
          }));

          export const conceptRouteCases = Object.freeze(modelRouteBrowserCases.map(({ model, section }) => Object.freeze({
            model,
            section,
          })));
          '''.replace("          ", ""))

          replace_once(
              "research-history/model-page.mjs",
              'import { studyPresentations } from "./catalog/study-presentations.mjs";\nimport { modelDiagramPresentations } from "./catalog/model-diagram-presentations.mjs";',
              'import { studyPresentations } from "./catalog/study-presentations.mjs";\nimport { modelRouteContractById } from "./catalog/model-route-contracts.mjs";',
          )
          replace_once(
              "research-history/model-page.mjs",
              'const diagramPresentationFor = (model) => modelDiagramPresentations[model.id] ?? null;',
              'const diagramPresentationFor = (model) => modelRouteContractById[model.id]?.diagram ?? null;',
          )

          replace_once(
              "scripts/archive/validate-model-route-browser.mjs",
              'import { setTimeout as delay } from "node:timers/promises";\n',
              'import { setTimeout as delay } from "node:timers/promises";\nimport { modelRouteBrowserCases as modelCases } from "./model-route-browser-cases.mjs";\n',
          )
          regex_once(
              "scripts/archive/validate-model-route-browser.mjs",
              r'\nconst modelCases = Object\.freeze\(\[\n.*?\n\]\);\n\nconst findBrowser',
              '\n\nconst findBrowser',
          )

          replace_once(
              "scripts/archive/validate-route-geometry-browser.mjs",
              'import { setTimeout as delay } from "node:timers/promises";\n',
              'import { setTimeout as delay } from "node:timers/promises";\nimport { routeGeometryCases as cases } from "./model-route-browser-cases.mjs";\n',
          )
          regex_once(
              "scripts/archive/validate-route-geometry-browser.mjs",
              r'\nconst cases = Object\.freeze\(\[\n.*?\n\]\);\n\nconst findBrowser',
              '\n\nconst findBrowser',
          )

          replace_once(
              "scripts/archive/validate-concept-route-breakpoints-browser.mjs",
              'import { setTimeout as delay } from "node:timers/promises";\n',
              'import { setTimeout as delay } from "node:timers/promises";\nimport { conceptRouteCases as cases } from "./model-route-browser-cases.mjs";\n',
          )
          regex_once(
              "scripts/archive/validate-concept-route-breakpoints-browser.mjs",
              r'\nconst cases = Object\.freeze\(\[\n.*?\n\]\.map\(\(\[model, section\]\) => \(\{ model, section \}\)\)\);\n\nconst widths',
              '\n\nconst widths',
          )

          replace_once(
              "scripts/archive/validate-model-diagram-presentations.mjs",
              'import { designModels } from "../../research-history/catalog/presentation-models.mjs";\n',
              'import { modelRouteContracts } from "../../research-history/catalog/model-route-contracts.mjs";\n',
          )
          replace_once(
              "scripts/archive/validate-model-diagram-presentations.mjs",
              'const modelById = new Map(designModels.map((model) => [model.id, model]));\n',
              '',
          )
          replace_once(
              "scripts/archive/validate-model-diagram-presentations.mjs",
              '''const presentationIds = Object.keys(modelDiagramPresentations);
          const canonicalModelIds = designModels.map((model) => model.id);
          if (JSON.stringify(presentationIds) !== JSON.stringify(canonicalModelIds)) {
            throw new Error(`Diagram presentations must cover every design model in canonical order: ${canonicalModelIds.join(", ")}.`);
          }

          for (const [modelId, presentation] of Object.entries(modelDiagramPresentations)) {
            const model = modelById.get(modelId);
            if (!model) throw new Error(`Diagram presentation references unknown model ${modelId}.`);

          '''.replace("          ", ""),
              '''for (const contract of modelRouteContracts) {
            const { id: modelId, model, diagram: presentation } = contract;

          '''.replace("          ", ""),
          )
          replace_once(
              "scripts/archive/validate-model-diagram-presentations.mjs",
              '''  const canonicalSectionIds = model.sections.map((section) => section.id);
            const presentedSectionIds = Object.keys(presentation.sections);
            if (JSON.stringify(presentedSectionIds) !== JSON.stringify(canonicalSectionIds)) {
              throw new Error(`${modelId} diagram sections must preserve canonical section order: ${canonicalSectionIds.join(", ")}.`);
            }
          '''.replace("          ", ""),
              '  const canonicalSectionIds = contract.sections.map((section) => section.id);\n',
          )
          replace_once(
              "scripts/archive/validate-model-diagram-presentations.mjs",
              'console.log(`Model diagram presentations: ${presentationIds.length} complete model contracts verified.`);',
              'console.log(`Model diagram presentations: ${modelRouteContracts.length} complete model contracts verified.`);',
          )

          write("scripts/archive/validate-model-route-contracts.mjs", '''import { readFile } from "node:fs/promises";
          import { modelRouteContracts } from "../../research-history/catalog/model-route-contracts.mjs";
          import {
            conceptRouteCases,
            modelRouteBrowserCases,
            routeGeometryCases,
          } from "./model-route-browser-cases.mjs";
          import { root } from "./load-catalog.mjs";

          const canonicalModelIds = modelRouteContracts.map((contract) => contract.id);

          for (const contract of modelRouteContracts) {
            const canonicalSectionIds = contract.model.sections.map((section) => section.id);
            const contractSectionIds = contract.sections.map((section) => section.id);
            const diagramSectionIds = Object.keys(contract.diagram.sections);
            if (JSON.stringify(contractSectionIds) !== JSON.stringify(canonicalSectionIds)
              || JSON.stringify(diagramSectionIds) !== JSON.stringify(canonicalSectionIds)) {
              throw new Error(`${contract.id} route sections diverge from canonical model sections.`);
            }

            for (const section of contract.sections) {
              if (section.modelSection !== contract.model.sections.find((candidate) => candidate.id === section.id)) {
                throw new Error(`${contract.id}/${section.id} must retain the canonical section object.`);
              }
              if (section.objectIds !== section.modelSection.objectIds) {
                throw new Error(`${contract.id}/${section.id} must reuse canonical objectIds by reference.`);
              }
              if (section.defaultObjectId !== section.modelSection.defaultObjectId) {
                throw new Error(`${contract.id}/${section.id} default object diverges from canonical membership.`);
              }
              if (section.diagram !== contract.diagram.sections[section.id]) {
                throw new Error(`${contract.id}/${section.id} must reuse its route presentation object.`);
              }
              if ("objectIds" in section.diagram || "defaultObjectId" in section.diagram) {
                throw new Error(`${contract.id}/${section.id} diagram metadata must not duplicate membership.`);
              }
            }
          }

          const verifyCoverage = (cases, label) => {
            const ids = cases.map((testCase) => testCase.model);
            if (JSON.stringify(ids) !== JSON.stringify(canonicalModelIds)) {
              throw new Error(`${label} must cover canonical models in order: ${canonicalModelIds.join(", ")}.`);
            }
            for (const testCase of cases) {
              const contract = modelRouteContracts.find((candidate) => candidate.id === testCase.model);
              if (!contract?.sectionById[testCase.section]) {
                throw new Error(`${label} references unknown route ${testCase.model}/${testCase.section}.`);
              }
            }
          };

          verifyCoverage(modelRouteBrowserCases, "Model route browser cases");
          verifyCoverage(routeGeometryCases, "Route geometry cases");
          verifyCoverage(conceptRouteCases, "Concept-route cases");

          for (const testCase of modelRouteBrowserCases) {
            const contract = modelRouteContracts.find((candidate) => candidate.id === testCase.model);
            const section = contract.sectionById[testCase.section];
            if (testCase.title !== contract.title
              || testCase.kind !== contract.diagram.kind
              || testCase.nodeCount !== contract.sections.length
              || testCase.objectIds !== section.objectIds) {
              throw new Error(`${testCase.model} browser expectations must be derived from the route contract.`);
            }
          }

          const modelPage = await readFile(new URL("research-history/model-page.mjs", root), "utf8");
          const routeBrowser = await readFile(new URL("scripts/archive/validate-model-route-browser.mjs", root), "utf8");
          const geometryBrowser = await readFile(new URL("scripts/archive/validate-route-geometry-browser.mjs", root), "utf8");
          const breakpointBrowser = await readFile(new URL("scripts/archive/validate-concept-route-breakpoints-browser.mjs", root), "utf8");

          if (!modelPage.includes('modelRouteContractById') || modelPage.includes('modelDiagramPresentations')) {
            throw new Error("Model renderer must resolve diagram presentation through model route contracts.");
          }
          for (const [label, source, importName, forbidden] of [
            ["Model route browser", routeBrowser, "modelRouteBrowserCases", "const modelCases = Object.freeze(["],
            ["Route geometry browser", geometryBrowser, "routeGeometryCases", "const cases = Object.freeze(["],
            ["Concept-route browser", breakpointBrowser, "conceptRouteCases", "const cases = Object.freeze(["],
          ]) {
            if (!source.includes(importName)) throw new Error(`${label} must import shared route cases.`);
            if (source.includes(forbidden)) throw new Error(`${label} must not duplicate the model case table.`);
          }

          console.log(`Model route contracts: ${modelRouteContracts.length} canonical models drive renderer and browser coverage.`);
          '''.replace("          ", ""))

          replace_once(
              "scripts/archive/run-archive-validators.mjs",
              'await import("./validate-model-classification.mjs");',
              'await import("./validate-model-route-contracts.mjs");',
          )
          Path("scripts/archive/validate-model-classification.mjs").unlink()
          Path(".github/workflows/agent-model-route-source.yml").unlink()
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate refactor
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(archive): centralize model route contracts"
          git push origin HEAD:agent/model-route-source-of-truth
