name: Validate 22F Padding-only

on:
  pull_request:
    paths:
      - "research-history/phases/22f-padding-only/**"
      - "research-history/padding-only-focus.css"
      - "scripts/validate-22f-padding-only.mjs"
      - "docs/research-history/screenshots/22f/**"
      - ".github/workflows/22f-validation.yml"

permissions:
  contents: read

jobs:
  validate-22f:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Repository test
        run: npm test
      - name: Repository build
        run: npm run build
      - name: Validate 22F boundary
        run: node scripts/validate-22f-padding-only.mjs
