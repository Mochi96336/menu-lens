name: Validate pull request

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload static build
        uses: actions/upload-artifact@v6
        with:
          name: menu-lens-pr-build
          path: dist/
          if-no-files-found: error
          retention-days: 1

      - name: Install browser review fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f

      - name: Capture model-page browser review
        run: |
          node scripts/serve.mjs > /tmp/menu-lens-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          BROWSER_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$BROWSER_BIN"
          BROWSER_BIN="$BROWSER_BIN" node scripts/archive/capture-model-page-review.mjs

      - name: Upload model-page browser review
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: menu-lens-model-page-review
          path: browser-review/
          if-no-files-found: warn
          retention-days: 1
