name: Apply model-page self-review

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: agent/refine-model-workbench

      - name: Apply staged self-review payload
        run: |
          cat .self-review-payload/* | base64 --decode > /tmp/model-page-self-review.tar.gz
          tar -xzf /tmp/model-page-self-review.tar.gz
          bash APPLY.sh

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install browser review fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f

      - name: Capture model-page browser review
        run: |
          node scripts/serve.mjs > /tmp/menu-lens-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          BROWSER_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$BROWSER_BIN"
          BROWSER_BIN="$BROWSER_BIN" node scripts/archive/capture-model-page-review.mjs

      - name: Upload validated screenshots
        uses: actions/upload-artifact@v6
        with:
          name: menu-lens-model-page-self-review
          path: browser-review/
          if-no-files-found: error
          retention-days: 1

      - name: Commit validated self-review fixes
        run: |
          rm -rf browser-review
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden model workbench presentation"
          git push origin HEAD:agent/refine-model-workbench
