name: Validate 25P task evidence study

on:
  pull_request:
    branches:
      - agent/menu-lens-25p-band-labels-task

permissions:
  contents: write

jobs:
  validate-study:
    if: github.head_ref == 'agent/menu-lens-25p-task-evidence-study'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out study branch
        uses: actions/checkout@v4
        with:
          ref: agent/menu-lens-25p-task-evidence-study
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Chromium runner
        run: |
          npm install --no-save --package-lock=false playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Run study browser checks
        shell: bash
        run: |
          python3 -m http.server 4173 --directory research-history > /tmp/menu-lens-25p-study-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/studies/25p-task-evidence/ > /dev/null; then
              break
            fi
            sleep 0.5
          done
          node scripts/25p-task-evidence-browser.mjs

      - name: Commit deterministic browser report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-history/review-assets/25p-task-evidence/browser-report.json
          if ! git diff --cached --quiet; then
            git commit -m "test(research): record 25p task study browser evidence"
            git push origin HEAD:agent/menu-lens-25p-task-evidence-study
          fi
