name: Validate 22E Typography-only

on:
  pull_request:
    paths:
      - "research-history/phases/22e-typography-only/**"
      - "research-history/typography-only-focus.css"
      - "scripts/validate-22e-typography-only.mjs"
      - "docs/research-history/screenshots/22e/**"
      - ".github/workflows/22e-validation.yml"

permissions:
  contents: read

jobs:
  validate-22e:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Repository test
        run: npm test
      - name: Repository build
        run: npm run build
      - name: Validate 22E boundary
        run: node scripts/validate-22e-typography-only.mjs
