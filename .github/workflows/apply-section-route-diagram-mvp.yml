name: Apply section route diagram MVP

on:
  push:
    branches:
      - agent/section-route-diagram-mvp

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/section-route-diagram-mvp
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node scripts/apply-section-route-diagram-mvp.mjs
