name: Apply model toolbar semantics refinement

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-and-apply:
    if: github.head_ref == 'agent/refine-model-selection-semantics' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out refinement branch
        uses: actions/checkout@v6
        with:
          ref: agent/refine-model-selection-semantics
          fetch-depth: 0

      - name: Repair and apply toolbar semantics refinement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/archive/apply-model-toolbar-semantics.mjs')
          source = path.read_text()
          replacements = {
            'title: `${object.id} · 研究工具`,': 'title: object.id + " · 研究工具",',
            'meta: targets.length ? `比較 ${targets.join(" / ")}` : displayTitle(object),': 'meta: targets.length ? "比較 " + targets.join(" / ") : displayTitle(object),',
            'return { title: `${object.id} · 必要修正`, meta: displayTitle(object) };': 'return { title: object.id + " · 必要修正", meta: displayTitle(object) };',
            'elements.compareParent.textContent = comparing ? "結束比較" : `與 ${parent?.id ?? "parent"} 比較`;': 'elements.compareParent.textContent = comparing ? "結束比較" : "與 " + (parent?.id ?? "parent") + " 比較";',
            'variable: targetIds.length ? `${targetIds.join(" / ")} 盲測` : "比較研究流程",': 'variable: targetIds.length ? targetIds.join(" / ") + " 盲測" : "比較研究流程",',
            '? `${object.id} · 研究工具`': '? object.id + " · 研究工具"',
            ': (object.objectType === "correction" ? `${object.id} · 必要修正` : objectLabel(object));': ': (object.objectType === "correction" ? object.id + " · 必要修正" : objectLabel(object));',
            '? `${viewportLabel()} 原尺寸並排；整個操作板共用一條水平捲動。`': '? \\`${viewportLabel()} 原尺寸並排；整個操作板共用一條水平捲動。\\`',
            ': `${viewportLabel()} 原尺寸操作；切換模式與寬度不會重載研究物件。`;': ': \\`${viewportLabel()} 原尺寸操作；切換模式與寬度不會重載研究物件。\\`;',
          }
          for before, after in replacements.items():
            count = source.count(before)
            if count != 1:
              raise SystemExit(f'Expected one generated-template match for {before!r}, found {count}.')
            source = source.replace(before, after)
          path.write_text(source)
          PY
          node --check scripts/archive/apply-model-toolbar-semantics.mjs
          node scripts/archive/apply-model-toolbar-semantics.mjs
          node --check research-history/model-page.mjs
          node --check research-history/model-live-board.mjs
          node --check research-history/model-object-inspector.mjs
          node --check scripts/archive/validate-model-page-renderer.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install preview fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f

      - name: Generate previews and capture browser review
        run: |
          node scripts/serve.mjs > /tmp/menu-lens-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          BROWSER_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$BROWSER_BIN"
          BROWSER_BIN="$BROWSER_BIN" node scripts/archive/generate-model-previews.mjs
          BROWSER_BIN="$BROWSER_BIN" node scripts/archive/capture-model-page-review.mjs

      - name: Upload refined browser review
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: menu-lens-model-toolbar-semantics-review
          path: browser-review/
          if-no-files-found: warn
          retention-days: 1

      - name: Commit verified refinement
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            research-history/models/index.html \
            research-history/model-page.mjs \
            research-history/model-live-board.mjs \
            research-history/model-object-inspector.mjs \
            research-history/model-page-workbench.css \
            scripts/archive/validate-model-page-renderer.mjs
          git rm scripts/archive/apply-model-toolbar-semantics.mjs .github/workflows/apply-model-toolbar-semantics.yml
          git commit -m 'Refine model selection and comparison semantics'
          git push origin HEAD:agent/refine-model-selection-semantics
