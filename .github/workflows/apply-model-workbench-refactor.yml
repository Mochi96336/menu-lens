name: Apply model workbench hierarchy refactor

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-and-apply:
    if: github.head_ref == 'agent/refactor-model-workbench-hierarchy' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@v6
        with:
          ref: agent/refactor-model-workbench-hierarchy
          fetch-depth: 0

      - name: Verify and extract canonical-board refactor payload
        shell: bash
        run: |
          set -euo pipefail
          echo 'aea0680d1067f1ddcbd7180a17745afd8fe4f3c072ace5b8564d91ba84183a6f  .tmp-model-refactor-v2/part-00.txt' | sha256sum -c -
          echo '534303975a2b4de42ea1f3e948b36db229f784bf373c8ec543f273ab4cac16a8  .tmp-model-refactor-v2/part-01.txt' | sha256sum -c -
          echo '0afc0a1736dcae17d631e1e279d32ecb3caf0fff24a0072e8f598da261ddbcd5  .tmp-model-refactor-v2/part-02a.txt' | sha256sum -c -
          echo '5ec946066b8eb2ea6fc6d1c6db8fdfdddf5f8c160cc74c741e115de95a43ba54  .tmp-model-refactor-v2/part-02b.txt' | sha256sum -c -
          echo '74a86296f3f318ca46721b5623daef5dd205338c1a7372d571ce7e06f42db8fa  .tmp-model-refactor-v2/part-03.txt' | sha256sum -c -
          cat \
            .tmp-model-refactor-v2/part-00.txt \
            .tmp-model-refactor-v2/part-01.txt \
            .tmp-model-refactor-v2/part-02a.txt \
            .tmp-model-refactor-v2/part-02b.txt \
            .tmp-model-refactor-v2/part-03.txt > /tmp/model-refactor-v2.b64
          echo '3a3513175a20f028ff860c00bb482aa57c2154f8d51fac3c67a4c0ea04c14400  /tmp/model-refactor-v2.b64' | sha256sum -c -
          base64 --decode /tmp/model-refactor-v2.b64 > /tmp/model-refactor-v2.tar.gz
          echo 'a047979b923541eef7e913d163f10d3c2a7cc7af9b0848870177f6658450cd52  /tmp/model-refactor-v2.tar.gz' | sha256sum -c -
          tar -xzf /tmp/model-refactor-v2.tar.gz -C .
          node --check research-history/model-page-state.mjs
          node --check research-history/model-surface-pool.mjs
          node --check research-history/model-live-board.mjs
          node --check research-history/model-object-inspector.mjs
          node --check research-history/model-page.mjs
          node --check scripts/archive/validate-model-page-renderer.mjs
          node --check scripts/archive/capture-model-page-review.mjs
          node --check scripts/archive/validate-entrypoints.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install preview fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f

      - name: Generate previews and capture refactored workbench review
        run: |
          node scripts/serve.mjs > /tmp/menu-lens-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          BROWSER_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$BROWSER_BIN"
          BROWSER_BIN="$BROWSER_BIN" node scripts/archive/generate-model-previews.mjs
          BROWSER_BIN="$BROWSER_BIN" node scripts/archive/capture-model-page-review.mjs

      - name: Upload refactored browser review
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: menu-lens-model-workbench-refactor-review
          path: browser-review/
          if-no-files-found: warn
          retention-days: 1

      - name: Commit verified refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            research-history/models/index.html \
            research-history/model-page-workbench.css \
            research-history/model-page-state.mjs \
            research-history/model-surface-pool.mjs \
            research-history/model-live-board.mjs \
            research-history/model-object-inspector.mjs \
            research-history/model-page.mjs \
            scripts/archive/validate-model-page-renderer.mjs \
            scripts/archive/capture-model-page-review.mjs \
            scripts/archive/validate-entrypoints.mjs
          git rm -r .tmp-model-refactor .tmp-model-refactor-v2
          git commit -m 'Refactor model workbench information hierarchy'
          git push origin HEAD:agent/refactor-model-workbench-hierarchy
